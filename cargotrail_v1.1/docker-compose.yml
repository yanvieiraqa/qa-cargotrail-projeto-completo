# Sobe o sistema (porta 8000) e o simulador (porta 8001) com um único comando: docker compose up --build
services:
  simulador:
    build: .
    command: python -m simulator.main
    ports: ["8001:8001"]
  sistema:
    build: .
    command: python -m app.main
    ports: ["8000:8000"]
    environment:
      SIMULADOR_URL: http://simulador:8001
      SIMULADOR_ATIVO: "true"
      DB_PATH: /cargotrail/data/cargotrail.db
      # SESSAO_TIMEOUT_S: "60"   # tempo da sessão em segundos (padrão 900). Use 60 só para o caso CT-ACE-09 e depois volte ao padrão.
    volumes:
      - dados:/cargotrail/data   # volume do Docker (Linux): o SQLite funciona melhor do que numa pasta do Windows
    depends_on: [simulador]

volumes:
  dados:
